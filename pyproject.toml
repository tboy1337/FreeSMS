[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68" ]

[project]
name = "freesms"
version = "1.0.6"
description = "A comprehensive SMS management application with GUI, CLI, and API interfaces"
readme = "README.md"
keywords = [ "api", "cli", "gui", "messaging", "sms", "textbelt", "twilio" ]
license = { file = "LICENSE.md" }
authors = [ { name = "tboy1337", email = "tboy1337@example.com" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography",
  "keyring",
  "phonenumbers",
  "plyer",
  "pycountry",
  "pyside6",
  "python-dateutil",
  "python-dotenv",
  "requests",
  "schedule",
  "tabulate",
  "twilio",
]
optional-dependencies.dev = [
  "autopep8",
  "bandit",
  "black",
  "isort",
  "mypy",
  "pillow",
  "pip-audit",
  "pylint",
  "pyproject-fmt",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-qt",
  "pytest-timeout",
  "pytest-xdist",
  "types-requests",
]
urls."Bug Tracker" = "https://github.com/tboy1337/FreeSMS/issues"
urls.Documentation = "https://github.com/tboy1337/FreeSMS#readme"
urls.Homepage = "https://github.com/tboy1337/FreeSMS"
urls.Repository = "https://github.com/tboy1337/FreeSMS.git"
scripts.freesms = "src.main:main"
scripts.freesms-cli = "src.cli.cli:main"
gui-scripts.freesms-gui = "src.gui.app:main"

[tool.setuptools]
packages.find.where = [ "." ]
packages.find.include = [ "src*" ]
package-data."src.gui.assets" = [ "*.ico", "*.png" ]

# Black configuration
[tool.black]
target-version = [ "py312", "py313", "py314" ]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
force_grid_wrap = 0
ensure_newline_before_comments = true
sections = [ "FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER" ]
known_first_party = [ "src" ]
skip_glob = [ "*/__pycache__/*", "*/migrations/*" ]

[tool.pyproject-fmt]
column_width = 88
indent = 2
generate_python_version_classifiers = true
max_supported_python = "3.14"
table_format = "short"

[tool.bandit]
exclude_dirs = [ "tests" ]
skips = [ "B404", "B603", "B607", "B608" ]

[tool.pip-audit]
progress-spinner = "off"
timeout = 60
ignore-vuln = []
